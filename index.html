<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fireworks</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var c=document.getElementById('c'),ctx=c.getContext('2d'),W,H,particles=[];

function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

function explode(x,y){
  var hue=Math.random()*360,count=120+Math.random()*80|0;
  for(var i=0;i<count;i++){
    var angle=Math.random()*Math.PI*2,speed=1+Math.random()*5;
    particles.push({
      x:x,y:y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      decay:0.012+Math.random()*0.018,
      size:1.5+Math.random()*1.5,
      hue:hue+Math.random()*40-20
    });
  }
}

function frame(){
  requestAnimationFrame(frame);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=0.04;
    p.vx*=0.97;p.vy*=0.97;
    p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life*p.life;
    ctx.fillStyle='hsl('+p.hue+',100%,65%)';
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
}

function fire(e){
  var r=e.touches?e.touches[0]:e;
  explode(r.clientX,r.clientY);
}

c.addEventListener('click',fire);
c.addEventListener('touchstart',function(e){e.preventDefault();fire(e);},{passive:false});

explode(W/2,H/2);
frame();
</script>
</body>
</html>
